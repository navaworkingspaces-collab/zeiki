# Análisis estático — Zeiki
# Reglas estrictas (AC8 de HDU-001). Base: flutter_lints oficial.
# Referencia: https://pub.dev/packages/flutter_lints
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Política del proyecto: 0 warnings. Cualquier warning es bug o deuda documentada.
    todo: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # Reglas adicionales (decididas en spec HDU-001 §plan técnico punto 3).
    # Documentan el porqué en conventions §2.
    avoid_print: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
