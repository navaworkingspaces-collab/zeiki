name: zeiki
description: "Zeiki — App de facturación CFDI 4.0 con descarga masiva de CFDIs del SAT."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

# Dependencias base declaradas en HDU-001 (AC6). Versiones conservadoras (rangos caret).
# Ver docs/adr/ADR-003-supabase.md, ADR-004-bloc.md, ADR-005-getit.md.
dependencies:
  flutter:
    sdk: flutter

  # State management (ADR-004)
  flutter_bloc: ^8.1.6

  # Dependency injection (ADR-005)
  get_it: ^7.7.0

  # Backend (ADR-003). Mínimo `^2.13.0` porque usamos `publishableKey:`
  # (renombre de `anonKey:` introducido en 2.13.0 — ver changelog oficial).
  # Antes era `^2.5.6`, lo que permitía downgradear a <2.13.0 si se borraba
  # el lockfile; el código no compilaría sin el rename. Subido en
  # zeiki-auditor fix (HDU-002).
  supabase_flutter: ^2.13.0

  # Value equality para entidades y estados
  equatable: ^2.0.5

  # Almacenamiento seguro de credenciales (eFirma, tokens) — conventions §6
  flutter_secure_storage: ^9.2.2

  # Variables de entorno (Supabase URL/anon key) — conventions §10
  flutter_dotenv: ^5.1.0

  # Navegación declarativa. Justificación en HDU-001 §Notas.
  go_router: ^14.2.7

  # Deep links para Android (intent filters). go_router 14.x lo usa
  # internamente para que `zeiki://<ruta>` llegue al router como
  # `/<ruta>`. Aunque viene como transitive de go_router, lo declaramos
  # explícito para que figure en la lista de deps del proyecto
  # (conventions §11: deps explícitas, no implícitas).
  app_links: ^7.0.0

  # Login con Google (HDU-005, AC11). Wrapper local en
  # `lib/core/auth/google_sign_in_handler.dart` para mantener el plugin
  # aislado del código de feature y permitir fakes en tests (conventions
  # §3). Requiere que Hugo configure el provider en Supabase y registre
  # el SHA-1 del cert de debug en Google Cloud Console (spec §Riesgos,
  # runbook `docs/runbooks/google-signin-supabase.md`).
  google_sign_in: ^6.2.0

  cupertino_icons: ^1.0.8

  # Autenticación biométrica (huella/cara del SO) para Zeiki (HDU-005b).
  # Wrapper local en `lib/core/services/biometric_service.dart` para mantener
  # el plugin aislado del código de feature y permitir fakes en tests
  # (conventions §3). Requiere:
  #   - Android: `MainActivity` debe extender `FlutterFragmentActivity`
  #     (no `FlutterActivity`) para que use `BiometricPrompt`.
  #   - Android: permiso `android.permission.USE_BIOMETRIC` en el manifest.
  # Si el usuario la desactivó después de activar en Zeiki, `authenticate()`
  # falla — el fallback a login normal cubre ese caso.
  # Acción de Hugo pendiente: activar biometría en el Xiaomi
  # (Settings → Security → Fingerprint) para que el popup de "Activar huella"
  # funcione en QA.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Integration tests (requerido por `flutter test integration_test/`).
  # Bug del implementer de HDU-002: faltaba la dependencia.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: 1.3.3

flutter:
  uses-material-design: true
  # Carga variables de entorno desde assets/.env (conventions §10).
  # `assets/.env.example` es la plantilla commiteada; `assets/.env` es el
  # archivo real con valores (en `.gitignore`). Ambos se listan para que
  # `flutter_dotenv.loadFromAsset('assets/.env')` funcione tanto en dev
  # (Hugo lo crea antes de `flutter run`) como en build local.
  # HDU-002.
  assets:
    - assets/.env.example
    - assets/.env
